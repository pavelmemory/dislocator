services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dislocator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dislocator}
      POSTGRES_DB: ${POSTGRES_DB:-dislocator}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dislocator} -d ${POSTGRES_DB:-dislocator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default — only the backend reaches it inside the compose network.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dislocator}:${POSTGRES_PASSWORD:-dislocator}@db:5432/${POSTGRES_DB:-dislocator}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    # Reached only through Caddy; no host port published.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - backend
    # Static SPA served by nginx on :80 inside the network; reached through Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
